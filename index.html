<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Charvi Patel</title>
<meta name="description" content="Charvi Patel — Computer Science, Royal Holloway">
<style>
  :root { --fg:#2b2b2b; --muted:#7a7a7a; --bg:#f7f5f2; --card:#ffffff; --line:#e6e2dc; --accent:#5b6cff; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:100%; max-width:360px; text-align:center; }
  h1 { font-size:1.8rem; font-weight:600; }
  p { color:var(--muted); margin:6px 0 32px; font-size:.95rem; }
  a { display:block; padding:14px; margin-bottom:12px; background:var(--card); border:1px solid var(--line);
      border-radius:12px; color:var(--fg); text-decoration:none; font-weight:500;
      box-shadow:0 1px 2px rgba(0,0,0,.04); transition:border-color .15s, color .15s; }
  a:hover, a:active { border-color:var(--accent); color:var(--accent); }
  .addr { display:block; color:var(--muted); font-size:.85rem; margin-top:-4px; user-select:all; -webkit-user-select:all; }
</style>
</head>
<body>
<main>
  <h1>Charvi Patel</h1>
  <p>Computer Science · Royal Holloway, University of London</p>
  <a href="https://charvi-idk.github.io/">Portfolio</a>
  <a href="Charvi_Patel_CV.pdf" target="_blank">View my CV</a>
  <a href="https://www.linkedin.com/in/charvi-patel-779a53254/" target="_blank">LinkedIn</a>
  <a href="mailto:charvi.patel226@gmail.com" id="email">Email me</a>
  <small class="addr">charvi.patel226@gmail.com</small>
</main>
<script>
  // Copy the address on tap so something useful happens even without a mail app.
  document.getElementById('email').addEventListener('click', function () {
    var link = this, addr = 'charvi.patel226@gmail.com';
    function done() {
      link.textContent = 'Address copied ✓';
      setTimeout(function () { link.textContent = 'Email me'; }, 2500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(addr).then(done, function () {});
    } else {
      var t = document.createElement('textarea');
      t.value = addr; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { if (document.execCommand('copy')) done(); } catch (e) {}
      document.body.removeChild(t);
    }
  });
</script>
</body>
</html>
