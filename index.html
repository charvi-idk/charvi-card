<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Charvi Patel</title>

<style>
  :root { --fg:#2b2b2b; --muted:#7a7a7a; --bg:#f7f5f2; --card:#ffffff; --line:#e6e2dc; --accent:#5b6cff; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  main { width:100%; max-width:360px; text-align:center; }
  h1 { font-size:1.8rem; font-weight:600; }
  p { color:var(--muted); margin:6px 0 32px; font-size:.95rem; }
  a { display:block; padding:14px; margin-bottom:12px; background:var(--card); border:1px solid var(--line);
      border-radius:12px; color:var(--fg); text-decoration:none; font-weight:500;
      box-shadow:0 1px 2px rgba(0,0,0,.04); transition:border-color .15s, color .15s; }
  a:hover, a:active { border-color:var(--accent); color:var(--accent); }
</style>
